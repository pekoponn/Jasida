name: Deploy Jasida to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Complete one deployment before starting the next one.
concurrency:
  group: jasida-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Project identifiers are not credentials. Keep the existing site/domain.
      VERCEL_ORG_ID: team_qOA6NbwE3ahj0j8JT10wTZJf
      VERCEL_PROJECT_ID: prj_r000SdNjMyIyRKHm2rVRmXWrG9Km
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify deployment secret
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add VERCEL_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@59.16.0

      - name: Pull production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --scope iszz100s-projects

      - name: Build production artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --yes

      - name: Deploy production artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --yes --scope iszz100s-projects
